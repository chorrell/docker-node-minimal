name: Docker Image Testing

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "build.sh"
      - "get-build-targets.sh"
      - ".github/workflows/dockerimage.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: node-minimal

permissions:
  contents: read

jobs:
  check_version:
    runs-on: ubuntu-slim
    outputs:
      TARGETS: ${{ steps.get_targets.outputs.TARGETS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get build targets
        id: get_targets
        run: |
          TARGETS=$(./get-build-targets.sh -a)
          echo "TARGETS=$TARGETS" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target.version }}, ${{ matrix.platform }})
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check_version.outputs.TARGETS) }}
        platform:
          - amd64
          - arm64
        include:
          - platform: amd64
            os: ubuntu-26.04
          - platform: arm64
            os: ubuntu-26.04-arm

    runs-on: ${{ matrix.os }}
    env:
      NODE_VERSION: ${{ matrix.target.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.target.major }}
          max-size: 10G
          job-summary: Ccache Statistics
          install: yes
          create-symlink: true

      - name: Configure ccache
        run: |
          ccache --set-config=sloppiness=time_macros,locale,include_file_ctime,include_file_mtime
          ccache --set-config=hash_dir=false
          ccache -p

      - name: Display Node Version
        run: |
          echo "Building Node.js version: $NODE_VERSION"

      - name: Build Node
        run: |
          which gcc
          ./build.sh -n "$NODE_VERSION"
          ccache -s
          cp node-src/out/Release/node node

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE_NAME }}-${{ env.NODE_VERSION }}
          cache-from: type=gha,scope=${{ matrix.target.major }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.major }}-${{ matrix.platform }}

      - name: Test Image
        run: docker run --rm "${IMAGE_NAME}-${NODE_VERSION}" -e "console.log('Hello from Node.js ' + process.version)"
