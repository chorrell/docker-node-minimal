name: Docker Image Testing

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "build.sh"
      - "get-build-targets.sh"
      - ".github/workflows/dockerimage.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: node-minimal

permissions:
  contents: read

jobs:
  check_version:
    runs-on: ubuntu-slim
    outputs:
      TARGETS: ${{ steps.get_targets.outputs.TARGETS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get build targets
        id: get_targets
        run: |
          TARGETS=$(./get-build-targets.sh -a)
          echo "TARGETS=$TARGETS" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target.version }}, ${{ matrix.platform }})
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check_version.outputs.TARGETS) }}
        platform:
          - amd64
          - arm64
        include:
          - platform: amd64
            os: ubuntu-26.04
          - platform: arm64
            os: ubuntu-26.04-arm

    runs-on: ${{ matrix.os }}
    env:
      NODE_VERSION: ${{ matrix.target.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.target.major }}
          max-size: 10G
          job-summary: Ccache Statistics
          install: yes
          create-symlink: true

      - name: Configure ccache
        run: |
          ccache --set-config=sloppiness=time_macros,locale,include_file_ctime,include_file_mtime
          ccache --set-config=hash_dir=false
          ccache -p

      - name: Display Node Version
        run: |
          echo "Building Node.js version: $NODE_VERSION"

      - name: Build Node
        run: |
          which gcc
          ./build.sh -n "$NODE_VERSION"
          ccache -s
          cp node-src/out/Release/node node

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE_NAME }}-${{ env.NODE_VERSION }}
          cache-from: type=gha,scope=${{ matrix.target.major }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.major }}-${{ matrix.platform }}

      - name: Test Image
        run: docker run --rm "${IMAGE_NAME}-${NODE_VERSION}" -e "console.log('Hello from Node.js ' + process.version)"
