name: Linting

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-lint:
    uses: chorrell/workflows/.github/workflows/shell-lint.yml@v1

  markdownlint:
    uses: chorrell/workflows/.github/workflows/markdownlint.yml@v1
    with:
      globs: '*.md'
