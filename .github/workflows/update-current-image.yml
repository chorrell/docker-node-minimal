name: Update Image

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version to build (e.g., 20.10.0). Leave empty to auto-detect the Current and supported LTS releases.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_NAME: node-minimal
  GHCR_IMAGE: ghcr.io/chorrell/node-minimal

permissions:
  contents: read

jobs:
  check_version:
    runs-on: ubuntu-slim
    outputs:
      TARGETS: ${{ steps.get_targets.outputs.TARGETS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get build targets
        id: get_targets
        env:
          GITHUB_EVENT_INPUTS_NODE_VERSION: ${{ github.event.inputs.node_version }}
        run: |
          if [[ -n "${GITHUB_EVENT_INPUTS_NODE_VERSION}" ]]; then
            TARGETS=$(./get-build-targets.sh -n "${GITHUB_EVENT_INPUTS_NODE_VERSION}")
          else
            TARGETS=$(./get-build-targets.sh)
          fi
          echo "TARGETS=$TARGETS" >> "$GITHUB_OUTPUT"
          if [[ "$TARGETS" == "[]" ]]; then
            echo "No new Node.js versions to build"
          else
            jq -r '.[] | "Building Node.js version: \(.version) (tags: \(.tags | join(", ")))"' <<< "$TARGETS"
          fi

  build:
    name: build (${{ matrix.target.version }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check_version.outputs.TARGETS) }}
        platform:
          - amd64
          - arm64
        include:
          - platform: amd64
            os: ubuntu-26.04
          - platform: arm64
            os: ubuntu-26.04-arm

    needs: check_version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    if: needs.check_version.outputs.TARGETS != '[]'
    env:
      NODE_VERSION: ${{ matrix.target.version }}
      MAJOR_VERSION: ${{ matrix.target.major }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.target.major }}
          max-size: 10G
          job-summary: Ccache Statistics
          install: yes
          create-symlink: true

      - name: Configure ccache
        run: |
          ccache --set-config=sloppiness=time_macros,locale,include_file_ctime,include_file_mtime
          ccache --set-config=hash_dir=false
          ccache -p

      - name: Display Versions
        run: echo "Building Node.js version $NODE_VERSION (major $MAJOR_VERSION)"

      - name: Build Node
        run: |
          which gcc
          ./build.sh -n "$NODE_VERSION"
          ccache -s
          cp node-src/out/Release/node node

      - name: Attest Node binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: node

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE_NAME }}-${{ env.NODE_VERSION }}
          cache-from: type=gha,scope=${{ matrix.target.major }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.major }}-${{ matrix.platform }}

      - name: Test Image
        run: docker run --rm "${IMAGE_NAME}-${NODE_VERSION}" -e "console.log('Hello from Node.js ' + process.version)"

      - name: Build and push per-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ env.NODE_VERSION }}-${{ matrix.platform }}
            ${{ env.GHCR_IMAGE }}:build-${{ github.run_id }}-${{ env.NODE_VERSION }}-${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.target.major }}-${{ matrix.platform }}

  merge:
    name: merge (${{ matrix.target.version }})
    needs: [check_version, build]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check_version.outputs.TARGETS) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Run even if another target's build failed, so one broken line doesn't
    # block publishing the other. A target whose build failed has no staging
    # images, so its merge fails at `imagetools create` instead of publishing.
    if: ${{ !cancelled() && needs.check_version.result == 'success' && needs.check_version.outputs.TARGETS != '[]' }}
    env:
      NODE_VERSION: ${{ matrix.target.version }}
      TAGS: ${{ join(matrix.target.tags, ' ') }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create DockerHub multi-arch manifests
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REPO="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          TAG_ARGS=()
          for TAG in $TAGS; do
            TAG_ARGS+=(-t "${REPO}:${TAG}")
          done
          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${REPO}:build-${RUN_ID}-${NODE_VERSION}-amd64" \
            "${REPO}:build-${RUN_ID}-${NODE_VERSION}-arm64"
          DOCKERHUB_INDEX_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${REPO}:${NODE_VERSION}")
          echo "DOCKERHUB_INDEX_DIGEST=${DOCKERHUB_INDEX_DIGEST}" >> "$GITHUB_ENV"

      - name: Create GHCR multi-arch manifests
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          TAG_ARGS=()
          for TAG in $TAGS; do
            TAG_ARGS+=(-t "${GHCR_IMAGE}:${TAG}")
          done
          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${GHCR_IMAGE}:build-${RUN_ID}-${NODE_VERSION}-amd64" \
            "${GHCR_IMAGE}:build-${RUN_ID}-${NODE_VERSION}-arm64"
          GHCR_INDEX_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${GHCR_IMAGE}:${NODE_VERSION}")
          echo "GHCR_INDEX_DIGEST=${GHCR_INDEX_DIGEST}" >> "$GITHUB_ENV"

      - name: Attest GHCR image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/chorrell/node-minimal
          subject-digest: ${{ env.GHCR_INDEX_DIGEST }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest Docker Hub image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DOCKERHUB_INDEX_DIGEST }}
          push-to-registry: false
          create-storage-record: false

      - name: Inspect manifest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${NODE_VERSION}"
